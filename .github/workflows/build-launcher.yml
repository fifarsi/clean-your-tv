name: Build Clean Your TV Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK Platform 34 and Build Tools 34
        run: |
          sdkmanager --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build launcher APK
        working-directory: launcher
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK exists and is under 576 KiB
        run: |
          apk=launcher/app/build/outputs/apk/release/app-release.apk
          test -s "$apk"
          size=$(stat -c %s "$apk")
          echo "APK size: $size bytes"
          test "$size" -le 589824
          sha256sum "$apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: clean-your-tv-launcher-apk
          path: launcher/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
