name: Build Clean Your TV Launcher APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            echo "sdkmanager not found at $SDKMANAGER"
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install 'platforms;android-34' 'build-tools;34.0.0'

      - name: Build release launcher APK
        shell: bash
        working-directory: launcher
        run: |
          set -euo pipefail
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace assembleRelease

      - name: Verify APK and checksum
        shell: bash
        run: |
          set -euo pipefail
          find launcher/app/build/outputs/apk/release -name '*.apk' -type f -size +0c -print -exec sha256sum {} \;
          test -n "$(find launcher/app/build/outputs/apk/release -name '*.apk' -type f -size +0c -print -quit)"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: clean-your-tv-launcher-apk
          path: launcher/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
